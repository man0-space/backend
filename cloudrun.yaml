apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/maxScale: '100'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: 10047192908-compute@developer.gserviceaccount.com
      containers:
        - image: europe-west1-docker.pkg.dev/gen-lang-client-0482916375/cloud-run-source-deploy/api@sha256:e95c208c8251c70f21982ff9898b6bedf9a58767aaca34c809be46468d9ec84e
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            timeoutSeconds: 240
            periodSeconds: 240
            failureThreshold: 1
            tcpSocket:
              port: 8080
          env:
            - name: DOTENV_CONFIG_PATH
              value: /var/run/secrets/backend/.env
          volumeMounts:
            - name: backend-env
              mountPath: /var/run/secrets/backend
      volumes:
        - name: backend-env
          secret:
            secretName: backend-secrets
            items:
              - key: '1'
                path: .env
  traffic:
    - percent: 100
      latestRevision: true
